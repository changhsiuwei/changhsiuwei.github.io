<script>
(function () {
  var API = "https://hw-chang-site-views.hw-chang-site-admin-worker.workers.dev";
  function pathToFile(pathname) {
    var p = (pathname || "").replace(/^\/+|\/+$/g, "");
    if (!p || p === "index" || p === "index.html") return "index.md";
    p = p.replace(/\/(?:index)?\.html?$/i, "");
    p = p.replace(/\/index$/i, "");
    p = p.replace(/\.html?$/i, "");
    if (!p) return "index.md";
    if (p === "students") return "students/index.qmd";
    if (!/\.(md|qmd)$/i.test(p)) {
      p = p + "/index.md";
    }
    return p;
  }

  var file = pathToFile(window.location.pathname);
  var payload = JSON.stringify({ path: file });

  try {
    if (window.fetch) {
      fetch(API + "/api/track", {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: payload,
        mode: "cors",
        keepalive: true
      }).catch(function () {});
    } else if (navigator.sendBeacon) {
      navigator.sendBeacon(API + "/api/track", payload);
    }
  } catch (e) {}
})();
</script>
