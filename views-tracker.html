<script>
(function () {
  var API = "https://hw-chang-site-views.hw-chang-site-admin-worker.workers.dev";
  function pathToFile(pathname) {
    var p = pathname.replace(/^\/+|\/+$/g, "");
    if (p === "") return "index.md";
    if (/\.html?$/.test(p)) p = p.replace(/\.html?$/, "");
    if (p === "index") return "index.md";
    return p + "/index.md";
  }
  var file = pathToFile(window.location.pathname);
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(API + "/api/track", new Blob([JSON.stringify({ path: file })], { type: "application/json" }));
    } else {
      fetch(API + "/api/track", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ path: file }),
        keepalive: true
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
